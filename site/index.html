<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Builder</title>
  <style>
    :root { --bg: #f4f4f7; --card: #fff; --text: #1d1d24; --muted: #5b5b6b; --accent: #6c4cf1; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121218; --card: #1d1d26; --text: #f1f1f5; --muted: #a3a3b5; --accent: #9b85ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 720px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    p { margin: 0 0 24px; color: var(--muted); }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    a.card { display: block; padding: 20px; border-radius: 14px; background: var(--card); color: inherit; text-decoration: none; box-shadow: 0 4px 18px rgba(0,0,0,.08); transition: transform .2s; }
    a.card:hover { transform: translateY(-3px); }
    .card b { display: block; font-size: 20px; color: var(--accent); }
    footer { margin-top: 28px; font-size: 14px; color: var(--muted); }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Portfolio Builder</h1>
    <p>3 ta demo portfolio · 3 demo portfolios · 3 демо-портфолио</p>
    <div class="grid">
      <a class="card" href="./v1/"><b>v1</b>HTML · CSS · JS</a>
      <a class="card" href="./v2/"><b>v2</b>Vite · Bootstrap · SCSS</a>
      <a class="card" href="./v3/"><b>v3</b>React · TypeScript · MUI</a>
    </div>
    <footer>Developed by <a href="https://t.me/Abdulloh_77700" target="_blank" rel="noopener">t.me/Abdulloh_77700</a></footer>
  </main>
</body>
</html>
